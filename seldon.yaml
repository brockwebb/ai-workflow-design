event_store:
  path: seldon_events.jsonl
neo4j:
  database: seldon-ai-workflow-design
  uri: bolt://localhost:7687
project:
  created_at: '2026-03-27T00:00:00.000000Z'
  domain: research
  name: ai-workflow-design
  slug: ai-workflow-design
  description: "AI Workflow Design for Official Statistics"

paths:
  cc_tasks: cc_tasks/
  handoffs: handoffs/
  book: book/
  docs: docs/
  assets: assets/

shared_ontology:
  # Per AD-017: Central Validity Ontology
  # This project inherits shared terminology from the main Seldon repo.
  # Canonical definitions live in seldon/ontology/ — NOT in this project.
  # Project-level terms can extend but never override the shared namespace.
  source: /Users/brock/Documents/GitHub/seldon/ontology/
  vocabularies:
    - validity/VALIDITY_VOCABULARY.md
    - practitioner/PRACTITIONER_VOCABULARY.md
  inheritance: read-only  # This project queries, does not own

conventions:
  cc_task_naming: "YYYY-MM-DD_<descriptive_slug>.md"
  chapter_naming: "chapter-NN.md"
  handoff_naming: "HANDOFF_YYYY-MM-DD-sessionN.md"
  figures_term: "figure"
  prohibited_tools:
    - "github:create_or_update_file"

prior_art:
  # AD-036 (seldon): the prior-art receipts gate, by REFERENCE to seldon's one definition, never a copy (SQ-010
  # Part 0; seldon docs/design/AD-036_ADDENDUM_03_prior_art_by_reference.md). The corpus paths resolve from seldon's
  # file; the log, the design directory, the baseline and the verdict ledger resolve from this repository. Only the
  # baseline is this repository's own: the notes on main when the gate reached it, grandfathered.
  ref: ../seldon/seldon.yaml#prior_art
  gate:
    baseline: docs/design/AD-036_baseline.txt
